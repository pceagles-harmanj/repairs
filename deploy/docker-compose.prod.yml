# Production compose for the repair app.
#
#   cd /opt/repairs && docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Two ports, on purpose:
#   8080  the tech app  - LAN only, never forward this
#   8081  the student status site - the only thing worth exposing later
#
# With TLS on (see deploy/tls-letsencrypt.sh) the host maps 443 -> 8081 and
# 8443 -> 8080, and the two plain-http ports below answer only with a redirect
# so that magic links already sitting in inboxes keep working.
services:
  repairs:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Pass these through so the footer can name the build:
        #   GIT_COMMIT=$(git rev-parse HEAD) docker compose ... build
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: repairs:local
    container_name: repairs
    restart: unless-stopped
    # Reap zombies and forward signals without adding tini to the image.
    init: true
    env_file:
      - ../.env
    ports:
      - "8080:8080"
      - "8081:8081"
      # Uncomment together with the TLS_* settings in .env:
      # - "8443:8443"     # tech UI over https
      # - "443:8443"      # or expose it on the normal port
      # - "80:8081"       # http -> https redirect for old emailed links
    volumes:
      # the database and its WAL live here - back this up (it is also what the
      # nightly job copies to the NAS)
      - ./data:/app/data
      # the NAS share, mounted on the host at /mnt/nas-repairs (see runbook)
      - /mnt/nas-repairs:/backups
      # certificates written by acme.sh on the host, read-only to the app
      - /etc/repairs-tls:/etc/repairs-tls:ro
    environment:
      - NODE_ENV=production
      - TZ=America/Chicago
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
